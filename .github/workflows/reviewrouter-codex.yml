name: ReviewRouter Hosted Codex

# Fresh operation for the runner-rendezvous-qualified native bootstrap 3bea0ac2f4b7.
# Consumed runs 35-38 must not be rerun; native metadata binds this new head.

run-name: ${{ format('ReviewRouter hosted review PR {0} at {1}', github.event.pull_request.number, github.event.pull_request.head.sha) }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions: {}

jobs:
  codex-review:
    name: codex-review
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' && (github.event.pull_request.draft == false || vars.REVIEW_ROUTER_REVIEW_DRAFTS == 'true') }}
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: 777genius/review-router/.github/workflows/reviewrouter-execution-reusable.yml@89ae44621cabe851715f864c27266769b02858b6
    with:
      review_action_lane: newtest-one-shot
      runtime_ref: "89ae44621cabe851715f864c27266769b02858b6"
      api_url: "https://api.reviewrouter.site"
      runtime_config_mode: oidc
      static_runtime_env_json: "{}"
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
      review_head_sha: ${{ github.event.pull_request.head.sha }}
      provider_instance_id: "hosted-pool:repository:1252762369"
      workflow_schema_version: 2
      max_changed_lines: "2000"
      review_timeout_minutes: 15
